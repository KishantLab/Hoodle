<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Lab Exam Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reset-card {
            max-width: 440px;
            margin: 3rem auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="background-decor"></div>
    <main class="container">
        <div class="card reset-card">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔒</div>
            <h1 style="font-size: 1.6rem; color: #0f172a; margin-bottom: 0.5rem;">Set New Password</h1>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.75rem;">
                Your password was reset by the administrator. Please choose a new secure password to access your dashboard.
            </p>

            {% if error %}
            <div class="alert alert-error" style="display: block; text-align: left;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('set_password') }}">
                <div class="form-group" style="text-align: left;">
                    <label for="new_password"><span class="label-title">New Password (min 6 chars) *</span></label>
                    <input type="password" id="new_password" name="new_password" minlength="6" required style="width: 100%; padding: 0.85rem; border: 2px solid var(--border-color); border-radius: var(--radius-md);">
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="confirm_password"><span class="label-title">Confirm New Password *</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" minlength="6" required style="width: 100%; padding: 0.85rem; border: 2px solid var(--border-color); border-radius: var(--radius-md);">
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 1rem;">
                    Save Password & Continue
                </button>
            </form>
        </div>

        <footer class="footer">
            <div class="accl-footer-banner">
                <img src="{{ url_for('static', filename='images/accl_logo.png') }}" alt="ACCL Logo" class="accl-mini-logo">
                <span>Developed by Kishan Tamboli (PhD) • Accelerated Computing Research Lab (ACCL), IIT Bhilai</span>
            </div>
        </footer>
    </main>
</body>
</html>
