{% extends "base.html" %}

{% block title %}Verify OTP &amp; Reset Password - Hoodle{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2.5rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🛡️</div>
      <h2 style="font-size: 1.4rem; font-weight: 800; color: #1e3a8a; margin: 0 0 0.35rem 0;">Reset Password</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">
        Enter the 6-digit OTP sent to your email and choose your new password.
      </p>
    </div>

    <form action="{{ url_for('reset_password') }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="identifier" style="font-weight: 700; font-size: 0.85rem;">Roll Number, Email, or Username</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="B26DS001" required value="{{ request.args.get('identifier', '') }}">
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="otp_code" style="font-weight: 700; font-size: 0.85rem; display: flex; justify-content: space-between;">
          <span>6-Digit OTP Code</span>
          <span style="font-weight: 500; color: var(--text-muted); font-size: 0.78rem;">Valid for 15 mins</span>
        </label>
        <input type="text" id="otp_code" name="otp_code" class="form-control" placeholder="123456" maxlength="8" required style="font-family: monospace; font-size: 1.25rem; letter-spacing: 0.25em; text-align: center; font-weight: 800;" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="new_password" style="font-weight: 700; font-size: 0.85rem;">New Password</label>
        <div class="password-input-wrap">
          <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new_password', this)" title="Show password" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="confirm_password" style="font-weight: 700; font-size: 0.85rem;">Confirm New Password</label>
        <div class="password-input-wrap">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)" title="Show password" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 700; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
        🔒 Update Password &amp; Sign In →
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Didn't receive the email?
      <a href="{{ url_for('forgot_password') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Request new code</a>
      <span style="margin: 0 0.4rem;">•</span>
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
