<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Lab Exam Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-card {
            max-width: 420px;
            margin: 2.5rem auto;
            text-align: center;
        }
        .logos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .logo-img {
            height: 64px;
            object-fit: contain;
        }
        .login-title {
            font-size: 1.7rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }
        .login-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="background-decor"></div>
    <main class="container">
        <div class="card login-card">
            <div class="logos-row">
                <img src="{{ url_for('static', filename='images/iitbhilai_logo.png') }}" alt="IIT Bhilai" class="logo-img">
            </div>

            <h1 class="login-title">Lab Exam Portal</h1>
            <p class="login-sub">Teacher & Instructor Login • IIT Bhilai</p>

            {% if error %}
            <div class="alert alert-error" style="display: block; text-align: left;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group" style="text-align: left;">
                    <label for="username">
                        <span class="label-title">Username</span>
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus style="text-transform: none;">
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="password">
                        <span class="label-title">Password</span>
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required style="width: 100%; padding: 0.85rem 1.15rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem;">
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 1rem;">
                    Log In to Dashboard
                </button>
            </form>
        </div>

        <footer class="footer">
            <div class="accl-footer-banner">
                <img src="{{ url_for('static', filename='images/accl_logo.png') }}" alt="ACCL Logo" class="accl-mini-logo">
                <span>Developed by Kishan Tamboli (PhD) • Accelerated Computing Research Lab (ACCL), IIT Bhilai</span>
            </div>
        </footer>
    </main>
</body>
</html>
