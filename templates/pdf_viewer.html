<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>{{ title or 'Document Viewer' }} - Hoodle LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/pdf/pdf.min.js') }}"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .pdf-toolbar {
      height: 52px;
      background: #1e293b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 100;
    }
    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    @media (max-width: 600px) {
      .doc-title { max-width: 130px; font-size: 0.8rem; }
      .hide-mobile { display: none !important; }
    }
    .tool-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .tool-btn:active { transform: scale(0.96); }
    .tool-btn.btn-download {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    .tool-btn.btn-download:hover { background: #1d4ed8; }
    .page-indicator {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
      padding: 0 4px;
    }
    #pdfContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px 40px;
      gap: 16px;
      background: #0b0f19;
      scroll-behavior: smooth;
      position: relative;
    }
    .pdf-page-wrapper {
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      border-radius: 4px;
      background: white;
      overflow: hidden;
      max-width: 100%;
    }
    .pdf-page-wrapper canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    #loadingSpinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 0.88rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #errorMessage {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      border: 1px solid #ef4444;
      padding: 20px 24px;
      border-radius: 12px;
      text-align: center;
      max-width: 90%;
      width: 380px;
    }
  </style>
</head>
<body>
  <div class="pdf-toolbar">
    <div class="toolbar-left">
      <span style="font-size: 1.15rem;">📕</span>
      <span class="doc-title" title="{{ title }}">{{ title or 'Document' }}</span>
    </div>

    <div class="toolbar-center">
      <button type="button" class="tool-btn" id="prevPageBtn" title="Previous Page">‹</button>
      <span class="page-indicator" id="pageIndicator">...</span>
      <button type="button" class="tool-btn" id="nextPageBtn" title="Next Page">›</button>

      <div class="hide-mobile" style="display:flex; align-items:center; gap:4px; margin-left:8px;">
        <button type="button" class="tool-btn" id="zoomOutBtn" title="Zoom Out">−</button>
        <button type="button" class="tool-btn" id="zoomFitBtn" title="Fit to Width">Fit</button>
        <button type="button" class="tool-btn" id="zoomInBtn" title="Zoom In">+</button>
      </div>
    </div>

    <div class="toolbar-right">
      <button type="button" class="tool-btn btn-download" id="downloadBtn" title="Fast In-App Download">
        <span>⬇</span>
        <span class="hide-mobile">Download</span>
      </button>
    </div>
  </div>

  <div id="pdfContainer">
    <div id="loadingSpinner">
      <div class="spinner"></div>
      <span id="loadingText">Loading document...</span>
    </div>

    <div id="errorMessage">
      <div style="font-size:1.8rem; margin-bottom:8px;">⚠️</div>
      <div style="font-weight:700; margin-bottom:6px; color:#f87171;">Unable to render PDF</div>
      <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:14px;" id="errorDetails">The document could not be loaded directly.</p>
      <a id="fallbackDownloadBtn" href="#" class="tool-btn btn-download" style="display:inline-flex;">Download File Directly</a>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const fileUrl = decodeURIComponent("{{ file_url | escape }}");
      const downloadUrl = decodeURIComponent("{{ download_url or file_url | escape }}");
      const docTitle = "{{ title or 'document.pdf' | escape }}";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "{{ url_for('static', filename='js/pdf/pdf.worker.min.js') }}";

      let pdfDoc = null;
      let totalPages = 0;
      let currentPage = 1;
      let currentScale = 1.2;
      let isRendering = false;

      const container = document.getElementById('pdfContainer');
      const pageIndicator = document.getElementById('pageIndicator');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const loadingText = document.getElementById('loadingText');
      const errorMessage = document.getElementById('errorMessage');
      const errorDetails = document.getElementById('errorDetails');
      const fallbackDownloadBtn = document.getElementById('fallbackDownloadBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      fallbackDownloadBtn.href = downloadUrl;

      downloadBtn.addEventListener('click', function() {
        downloadBtn.innerHTML = '<span>⏳</span> <span class="hide-mobile">Saving...</span>';
        downloadBtn.disabled = true;

        fetch(downloadUrl, { credentials: 'include' })
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.blob();
          })
          .then(blob => {
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = docTitle.endsWith('.pdf') ? docTitle : (docTitle + '.pdf');
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(blobUrl);
            a.remove();
            downloadBtn.innerHTML = '<span>✅</span> <span class="hide-mobile">Saved</span>';
            setTimeout(() => {
              downloadBtn.innerHTML = '<span>⬇</span> <span class="hide-mobile">Download</span>';
              downloadBtn.disabled = false;
            }, 2000);
          })
          .catch(err => {
            window.location.href = downloadUrl;
            downloadBtn.innerHTML = '<span>⬇</span> <span class="hide-mobile">Download</span>';
            downloadBtn.disabled = false;
          });
      });

      loadingText.innerText = "Downloading PDF...";
      const loadingTask = pdfjsLib.getDocument({
        url: fileUrl,
        withCredentials: true
      });

      loadingTask.onProgress = function(progress) {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          loadingText.innerText = `Loading document (${percent}%)...`;
        }
      };

      loadingTask.promise.then(function(pdf) {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        pageIndicator.innerText = `1 / ${totalPages}`;
        loadingSpinner.style.display = 'none';

        fitToWidth();
        renderAllPages();
      }).catch(function(err) {
        console.error("PDF.js load error:", err);
        loadingSpinner.style.display = 'none';
        errorMessage.style.display = 'block';
        errorDetails.innerText = err.message || 'Error downloading or decoding PDF.';
      });

      function fitToWidth() {
        if (!pdfDoc) return;
        pdfDoc.getPage(1).then(page => {
          const viewport = page.getViewport({ scale: 1.0 });
          const containerWidth = container.clientWidth - 32;
          currentScale = Math.min(Math.max(containerWidth / viewport.width, 0.6), 2.5);
          renderAllPages();
        });
      }

      function renderAllPages() {
        if (!pdfDoc || isRendering) return;
        isRendering = true;

        const existingPages = container.querySelectorAll('.pdf-page-wrapper');
        existingPages.forEach(p => p.remove());

        const outputScale = window.devicePixelRatio || 1;
        let pagesRendered = 0;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'pdf-page-wrapper';
          pageWrapper.id = `page-${pageNum}`;
          container.appendChild(pageWrapper);

          const canvas = document.createElement('canvas');
          pageWrapper.appendChild(canvas);

          (function(num, c, wrapper) {
            pdfDoc.getPage(num).then(function(page) {
              const viewport = page.getViewport({ scale: currentScale });
              c.width = Math.floor(viewport.width * outputScale);
              c.height = Math.floor(viewport.height * outputScale);
              c.style.width = Math.floor(viewport.width) + "px";
              c.style.height = Math.floor(viewport.height) + "px";

              const ctx = c.getContext('2d');
              ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

              const renderContext = {
                canvasContext: ctx,
                viewport: viewport
              };

              page.render(renderContext).promise.then(() => {
                pagesRendered++;
                if (pagesRendered === totalPages) {
                  isRendering = false;
                }
              });
            });
          })(pageNum, canvas, pageWrapper);
        }
      }

      container.addEventListener('scroll', function() {
        if (!totalPages) return;
        const pageElements = container.querySelectorAll('.pdf-page-wrapper');
        const containerTop = container.scrollTop + 60;

        for (let i = 0; i < pageElements.length; i++) {
          const el = pageElements[i];
          if (el.offsetTop <= containerTop && (el.offsetTop + el.offsetHeight) > containerTop) {
            currentPage = i + 1;
            pageIndicator.innerText = `${currentPage} / ${totalPages}`;
            break;
          }
        }
      });

      document.getElementById('prevPageBtn').addEventListener('click', function() {
        if (currentPage > 1) {
          currentPage--;
          scrollToPage(currentPage);
        }
      });

      document.getElementById('nextPageBtn').addEventListener('click', function() {
        if (currentPage < totalPages) {
          currentPage++;
          scrollToPage(currentPage);
        }
      });

      function scrollToPage(num) {
        const el = document.getElementById(`page-${num}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        pageIndicator.innerText = `${num} / ${totalPages}`;
      }

      document.getElementById('zoomInBtn').addEventListener('click', function() {
        currentScale = Math.min(currentScale + 0.25, 3.0);
        renderAllPages();
      });

      document.getElementById('zoomOutBtn').addEventListener('click', function() {
        currentScale = Math.max(currentScale - 0.25, 0.5);
        renderAllPages();
      });

      document.getElementById('zoomFitBtn').addEventListener('click', fitToWidth);
    })();
  </script>
</body>
</html>
