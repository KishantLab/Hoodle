<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>{{ title or 'Document Viewer' }} - Hoodle LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/pdf/pdf.min.js') }}"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    /* Compact Toolbar */
    .pdf-toolbar {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 100;
    }
    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    @media (max-width: 600px) {
      .doc-title { max-width: 110px; font-size: 0.78rem; }
      .hide-mobile { display: none !important; }
    }
    .tool-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .tool-btn:active { transform: scale(0.96); }
    .tool-btn.btn-download {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    .tool-btn.btn-download:hover { background: #1d4ed8; }
    .page-indicator {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
      padding: 0 6px;
    }
    
    /* Embedded inside modal iframe */
    body.is-embedded .toolbar-left,
    body.is-embedded .toolbar-right {
      display: none !important;
    }
    body.is-embedded .pdf-toolbar {
      justify-content: center !important;
      height: 38px !important;
      background: #111827 !important;
      border-bottom: 1px solid rgba(255,255,255,0.06) !important;
    }

    /* Main PDF Viewport */
    #pdfContainer {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      overflow-y: auto;
      overflow-x: auto;
      padding: 16px 8px 48px;
      background: #0b0f19;
      text-align: center;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .pdf-page-wrapper {
      display: inline-block;
      margin: 0 auto 16px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      border-radius: 4px;
      background: white;
      vertical-align: top;
      overflow: hidden;
    }
    .pdf-page-wrapper canvas {
      display: block;
      margin: 0 auto;
    }
    /* Loading & Error States */
    #loadingSpinner {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 0.88rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #errorMessage {
      display: none;
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      border: 1px solid #ef4444;
      padding: 20px 24px;
      border-radius: 12px;
      text-align: center;
      max-width: 90%;
      width: 360px;
    }
  </style>
</head>
<body>
  <!-- Header Toolbar -->
  <div class="pdf-toolbar" id="pdfToolbar">
    <div class="toolbar-left">
      <span style="font-size: 1.1rem;">📕</span>
      <span class="doc-title" title="{{ title }}">{{ title or 'Document' }}</span>
    </div>

    <div class="toolbar-center">
      <button type="button" class="tool-btn" id="prevPageBtn" title="Previous Page">‹</button>
      <span class="page-indicator" id="pageIndicator">1 / ...</span>
      <button type="button" class="tool-btn" id="nextPageBtn" title="Next Page">›</button>

      <div class="hide-mobile" style="display:flex; align-items:center; gap:4px; margin-left:8px;">
        <button type="button" class="tool-btn" id="zoomOutBtn" title="Zoom Out">−</button>
        <button type="button" class="tool-btn" id="zoomFitBtn" title="Fit to Width">Fit</button>
        <button type="button" class="tool-btn" id="zoomInBtn" title="Zoom In">+</button>
      </div>
    </div>

    <div class="toolbar-right">
      <button type="button" class="tool-btn btn-download" id="downloadBtn" title="Download Document">
        <span>⬇</span>
        <span class="hide-mobile">Download</span>
      </button>
    </div>
  </div>

  <!-- PDF Scroll Container -->
  <div id="pdfContainer">
    <div id="loadingSpinner">
      <div class="spinner"></div>
      <span id="loadingText">Loading document...</span>
    </div>

    <div id="errorMessage">
      <div style="font-size:1.8rem; margin-bottom:8px;">⚠️</div>
      <div style="font-weight:700; margin-bottom:6px; color:#f87171;">Unable to render PDF</div>
      <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:14px;" id="errorDetails">The document could not be loaded.</p>
      <a id="fallbackDownloadBtn" href="#" class="tool-btn btn-download" style="display:inline-flex;">Download Directly</a>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const fileUrl = decodeURIComponent("{{ file_url | escape }}");
      const downloadUrl = decodeURIComponent("{{ download_url or file_url | escape }}");
      const docTitle = "{{ title or 'document.pdf' | escape }}";

      if (window.self !== window.top) {
        document.body.classList.add('is-embedded');
      }


      pdfjsLib.GlobalWorkerOptions.workerSrc = "{{ url_for('static', filename='js/pdf/pdf.worker.min.js') }}";

      let pdfDoc = null;
      let totalPages = 0;
      let currentPage = 1;
      let currentScale = 1.0;
      let isRendering = false;

      const container = document.getElementById('pdfContainer');
      const pageIndicator = document.getElementById('pageIndicator');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const loadingText = document.getElementById('loadingText');
      const errorMessage = document.getElementById('errorMessage');
      const errorDetails = document.getElementById('errorDetails');
      const fallbackDownloadBtn = document.getElementById('fallbackDownloadBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      fallbackDownloadBtn.href = downloadUrl;

      // Smart Download Handler: In Android App uses native bridge; In Browser uses direct link or blob
      downloadBtn.addEventListener('click', function(e) {
        e.preventDefault();
        
        // 1. Android App Bridge
        if (window.Android && typeof Android.downloadUrl === 'function') {
          Android.downloadUrl(downloadUrl, docTitle);
          return;
        }

        // 2. Direct browser navigation with attachment header
        let dl = downloadUrl;
        if (dl.indexOf('?') === -1) {
          dl += '?download=1';
        } else if (dl.indexOf('download=') === -1) {
          dl += '&download=1';
        }
        window.location.href = dl;
      });

      // Load Document via PDF.js
      loadingText.innerText = "Loading PDF...";
      const loadingTask = pdfjsLib.getDocument({
        url: fileUrl,
        withCredentials: true
      });

      loadingTask.onProgress = function(progress) {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          loadingText.innerText = `Loading document (${percent}%)...`;
        }
      };

      loadingTask.promise.then(function(pdf) {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        pageIndicator.innerText = `1 / ${totalPages}`;
        loadingSpinner.style.display = 'none';

        // Auto-fit to viewport width
        fitToWidth();
      }).catch(function(err) {
        console.error("PDF.js load error:", err);
        loadingSpinner.style.display = 'none';
        errorMessage.style.display = 'block';
        errorDetails.innerText = err.message || 'Error downloading or decoding PDF.';
      });

      function fitToWidth() {
        if (!pdfDoc) return;
        pdfDoc.getPage(1).then(page => {
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const availableWidth = Math.max((container.clientWidth || window.innerWidth) - 28, 260);
          currentScale = availableWidth / unscaledViewport.width;
          // Constrain zoom range
          currentScale = Math.min(Math.max(currentScale, 0.4), 3.0);
          renderAllPages();
        });
      }

      function renderAllPages() {
        if (!pdfDoc || isRendering) return;
        isRendering = true;

        // Remove old page wrappers
        const oldPages = container.querySelectorAll('.pdf-page-wrapper');
        oldPages.forEach(p => p.remove());

        const outputScale = window.devicePixelRatio || 1;
        let pagesRemaining = totalPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'pdf-page-wrapper';
          pageWrapper.id = `page-${pageNum}`;
          container.appendChild(pageWrapper);

          const canvas = document.createElement('canvas');
          pageWrapper.appendChild(canvas);

          (function(num, c, wrapper) {
            pdfDoc.getPage(num).then(function(page) {
              const viewport = page.getViewport({ scale: currentScale });

              // Explicit pixel sizes on both wrapper and canvas to prevent aspect-ratio squishing
              const displayWidth = Math.floor(viewport.width);
              const displayHeight = Math.floor(viewport.height);

              wrapper.style.width = displayWidth + "px";
              wrapper.style.height = displayHeight + "px";

              c.width = Math.floor(displayWidth * outputScale);
              c.height = Math.floor(displayHeight * outputScale);
              c.style.width = displayWidth + "px";
              c.style.height = displayHeight + "px";

              const ctx = c.getContext('2d');
              ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

              const renderContext = {
                canvasContext: ctx,
                viewport: viewport
              };

              page.render(renderContext).promise.then(() => {
                pagesRemaining--;
                if (pagesRemaining <= 0) {
                  isRendering = false;
                }
              }).catch(() => {
                pagesRemaining--;
                if (pagesRemaining <= 0) {
                  isRendering = false;
                }
              });
            });
          })(pageNum, canvas, pageWrapper);
        }
      }

      // Scroll Spy for Page Indicator
      container.addEventListener('scroll', function() {
        if (!totalPages) return;
        const pageElements = container.querySelectorAll('.pdf-page-wrapper');
        const containerTop = container.scrollTop + 80;

        for (let i = 0; i < pageElements.length; i++) {
          const el = pageElements[i];
          if (el.offsetTop <= containerTop && (el.offsetTop + el.offsetHeight) > containerTop) {
            currentPage = i + 1;
            pageIndicator.innerText = `${currentPage} / ${totalPages}`;
            break;
          }
        }
      });

      // Navigation
      document.getElementById('prevPageBtn').addEventListener('click', function() {
        if (currentPage > 1) {
          currentPage--;
          scrollToPage(currentPage);
        }
      });

      document.getElementById('nextPageBtn').addEventListener('click', function() {
        if (currentPage < totalPages) {
          currentPage++;
          scrollToPage(currentPage);
        }
      });

      function scrollToPage(num) {
        const el = document.getElementById(`page-${num}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          pageIndicator.innerText = `${num} / ${totalPages}`;
        }
      }

      // Zoom Controls
      document.getElementById('zoomInBtn').addEventListener('click', function() {
        currentScale = Math.min(currentScale + 0.2, 3.0);
        renderAllPages();
      });

      document.getElementById('zoomOutBtn').addEventListener('click', function() {
        currentScale = Math.max(currentScale - 0.2, 0.4);
        renderAllPages();
      });

      document.getElementById('zoomFitBtn').addEventListener('click', fitToWidth);

      // Handle orientation change / resize
      let resizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitToWidth, 300);
      });
    })();
  </script>
</body>
</html>
