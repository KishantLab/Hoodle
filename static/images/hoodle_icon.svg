<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <!-- Gradients matching IIT Bhilai and ACCL Academic Palette -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#24346e" />
      <stop offset="100%" stop-color="#1d2856" />
    </linearGradient>

    <linearGradient id="bookPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243775" />
      <stop offset="100%" stop-color="#192554" />
    </linearGradient>

    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="pageWingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM GROUP (Transparent Background) -->
  <g transform="translate(10, 8)">

    <!-- 1. ACADEMIC MORTARBOARD (Top) -->
    <!-- Cap Diamond Top -->
    <polygon points="110,12 195,44 110,76 25,44" fill="url(#capGrad)" stroke="#1d2856" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Cap Rim / Under-Brim -->
    <polygon points="48,53 110,76 172,53 162,69 110,88 58,69" fill="#1e3a8a" opacity="0.95" />
    <!-- Skullcap Base Arc -->
    <path d="M 68,69 Q 110,95 152,69 L 150,77 Q 110,105 70,77 Z" fill="#0f172a" opacity="0.8" />
    
    <!-- Cap Golden Border Accent -->
    <polyline points="28,44 110,74 192,44" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cap Golden Tassel -->
    <circle cx="110" cy="44" r="4.5" fill="#f59e0b" />
    <path d="M 110,44 Q 155,47 172,74" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="168,74 176,74 178,94 166,94" fill="url(#accentGold)" />

    <!-- 2. OPEN BOOK PAGES / WINGS (Left & Right Outers) -->
    <!-- Left Outer Book Page -->
    <path d="M 108,198 C 76,192 38,188 18,172 L 18,98 C 38,114 76,118 108,124 Z" 
          fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" />
    <!-- Left Inner Page Layer -->
    <path d="M 108,188 C 80,183 48,179 30,166 L 30,108 C 48,121 80,125 108,130" 
          fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="1 0" />

    <!-- Right Outer Book Page -->
    <path d="M 112,198 C 144,192 182,188 202,172 L 202,98 C 182,114 144,118 112,124 Z" 
          fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Inner Page Layer -->
    <path d="M 112,188 C 140,183 172,179 190,166 L 190,108 C 172,121 140,125 112,130" 
          fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="1 0" />

    <!-- 3. CENTRAL LETTER 'H' PILLARS & ARCHITECTURE -->
    <!-- Left Vertical Pillar of H -->
    <rect x="58" y="88" width="22" height="114" rx="5" fill="url(#bookPillarGrad)" stroke="#1d2856" stroke-width="1.5" />
    <!-- Left Pillar Inner Glow Track -->
    <line x1="69" y1="96" x2="69" y2="194" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Right Vertical Pillar of H -->
    <rect x="140" y="88" width="22" height="114" rx="5" fill="url(#bookPillarGrad)" stroke="#1d2856" stroke-width="1.5" />
    <!-- Right Pillar Inner Glow Track -->
    <line x1="151" y1="96" x2="151" y2="194" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Center Bridge (The 'H' Crossbar & Tech Circuit Loop) -->
    <path d="M 80,146 C 96,146 98,132 110,132 C 122,132 124,146 140,146" 
          fill="none" stroke="url(#cyanLineGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Upper Circuit Branch (Sky Cyan) -->
    <path d="M 110,132 L 110,106" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="110" cy="104" r="4.5" fill="#38bdf8" />

    <!-- Lower Circuit Branch (Golden Node) -->
    <path d="M 96,146 L 96,172 L 110,172" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="110" cy="172" r="4" fill="#f59e0b" />
    
    <path d="M 124,146 L 124,164" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="124" cy="164" r="3.5" fill="#38bdf8" />

    <!-- Left Circuit Node into Page -->
    <line x1="58" y1="135" x2="42" y2="135" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="40" cy="135" r="3.5" fill="#38bdf8" />

    <!-- Right Circuit Node into Page -->
    <line x1="162" y1="135" x2="178" y2="135" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="180" cy="135" r="3.5" fill="#38bdf8" />

    <!-- 4. OPEN BOOK SPINE BOTTOM CREST -->
    <path d="M 110,198 L 110,224 C 95,216 70,212 48,212 L 48,206 C 70,206 95,210 110,218 C 125,210 150,206 172,206 L 172,212 C 150,212 125,216 110,224 Z" 
          fill="#1e293b" />
    <polygon points="110,224 104,232 110,238 116,232" fill="#f59e0b" />

  </g>
</svg>
