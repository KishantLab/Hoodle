<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hoodleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM GROUP (Left) -->
  <g transform="translate(40, 20)" filter="url(#subtleGlow)">
    <!-- Mortarboard Academic Cap -->
    <polygon points="100,22 175,54 100,86 25,54" fill="url(#hoodleGrad1)" />
    <!-- Cap Under-Rim -->
    <polygon points="45,62 100,86 155,62 145,78 100,98 55,78" fill="#1e3a8a" opacity="0.9" />
    <!-- Cap Skull Cap Arc -->
    <path d="M 60,78 Q 100,105 140,78 L 138,88 Q 100,118 62,88 Z" fill="#1e293b" opacity="0.6" />
    <!-- Tassel -->
    <circle cx="100" cy="54" r="5" fill="#f59e0b" />
    <path d="M 100,54 Q 130,58 145,82" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <polygon points="142,82 148,82 149,102 141,102" fill="url(#goldGrad)" />

    <!-- Letter H Left Vertical Pillar / Open Book Wing -->
    <path d="M 45,95 C 30,108 20,128 20,155 C 20,182 32,198 45,205 L 68,205 C 55,195 48,178 48,155 C 48,128 58,110 68,95 Z" fill="#0284c7" />
    <rect x="58" y="95" width="22" height="110" rx="6" fill="url(#hoodleGrad1)" />

    <!-- Letter H Right Vertical Pillar -->
    <rect x="120" y="95" width="22" height="110" rx="6" fill="url(#hoodleGrad1)" />

    <!-- Letter H Crossbar & Tech Circuit Traces -->
    <path d="M 76,140 Q 100,125 124,146" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Circuit Nodes -->
    <line x1="80" y1="150" x2="105" y2="175" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="105" cy="175" r="5.5" fill="#f59e0b" />
    <line x1="105" y1="175" x2="122" y2="175" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="122" cy="175" r="4.5" fill="#fbbf24" />

    <line x1="80" y1="120" x2="102" y2="105" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="102" cy="105" r="5" fill="#06b6d4" />
    
    <!-- Outer Wing Accent -->
    <path d="M 155,95 C 168,108 178,128 178,155 C 178,182 166,198 155,205 L 138,205 C 148,195 154,178 154,155 C 154,128 146,110 138,95 Z" fill="#38bdf8" opacity="0.85" />
  </g>

  <!-- BRAND NAME & SLOGAN (Right) -->
  <g transform="translate(255, 0)">
    <!-- Brand Wordmark "Hoodle" -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="78" fill="#0f172a" letter-spacing="-1.5">
      Hoo<tspan fill="url(#hoodleGrad1)">dle</tspan>
    </text>
    
    <!-- Accent Dot -->
    <circle cx="270" cy="122" r="9" fill="#06b6d4" />
    <circle cx="270" cy="122" r="5" fill="#f59e0b" />

    <!-- Tagline Badge -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="485" height="32" rx="8" fill="#f1f5f9" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#0369a1" letter-spacing="0.5">
        ACCELERATED CLASSROOM &amp; LAB LEARNING • ACCL IIT BHILAI
      </text>
    </g>

    <!-- Subtitle Note -->
    <text x="2" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#64748b" letter-spacing="0.2">
      Next-Gen Collaborative Academic Learning &amp; Assessment Platform
    </text>
  </g>
</svg>
