<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Container Background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Inner Subtle Border Accent -->
  <rect x="14" y="14" width="228" height="228" rx="50" fill="none" stroke="url(#markGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Emblem -->
  <g transform="translate(28, 22)">
    <!-- Mortarboard Academic Cap -->
    <polygon points="100,26 175,58 100,90 25,58" fill="url(#markGrad)" />
    <!-- Cap Rim -->
    <polygon points="45,66 100,90 155,66 145,82 100,102 55,82" fill="#0284c7" opacity="0.9" />
    <!-- Tassel -->
    <circle cx="100" cy="58" r="5" fill="#f59e0b" />
    <path d="M 100,58 Q 130,62 145,86" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <polygon points="142,86 148,86 149,106 141,106" fill="url(#goldMark)" />

    <!-- Letter H Left Vertical Pillar / Open Book Wing -->
    <path d="M 45,98 C 30,111 20,131 20,158 C 20,185 32,201 45,208 L 68,208 C 55,198 48,181 48,158 C 48,131 58,113 68,98 Z" fill="#38bdf8" />
    <rect x="58" y="98" width="22" height="110" rx="6" fill="url(#markGrad)" />

    <!-- Letter H Right Vertical Pillar -->
    <rect x="120" y="98" width="22" height="110" rx="6" fill="url(#markGrad)" />

    <!-- Letter H Crossbar & Tech Circuit Traces -->
    <path d="M 76,143 Q 100,128 124,149" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Circuit Nodes -->
    <line x1="80" y1="153" x2="105" y2="178" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="105" cy="178" r="5.5" fill="#f59e0b" />
    <line x1="105" y1="178" x2="122" y2="178" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="122" cy="178" r="4.5" fill="#fbbf24" />

    <line x1="80" y1="123" x2="102" y2="108" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="102" cy="108" r="5" fill="#06b6d4" />
    
    <!-- Outer Wing Accent -->
    <path d="M 155,98 C 168,111 178,131 178,158 C 178,185 166,201 155,208 L 138,208 C 148,198 154,181 154,158 C 154,131 146,113 138,98 Z" fill="#38bdf8" opacity="0.85" />
  </g>
</svg>
